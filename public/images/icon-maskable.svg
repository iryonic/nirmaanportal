<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskableBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="maskableGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="maskableWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="maskShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Full-bleed background for Android Adaptive masks -->
  <rect width="512" height="512" fill="url(#maskableBg)" />

  <!-- Center Safe Zone Group (Scaled down to fit inside 80% circle) -->
  <g filter="url(#maskShadow)" transform="translate(256, 235) scale(0.85)">
    <!-- Golden Arc Swoosh from Logo -->
    <path d="M-150 40 C-130 -90, -40 -110, 30 -50 C-20 -70, -100 -55, -125 40 Z" fill="url(#maskableGold)" opacity="0.95" />
    <path d="M-135 15 C-115 -60, -45 -75, 10 -35" stroke="#FBBF24" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Bold Central N (Nirmaan) -->
    <path d="M-90 90 L-90 -70 L-40 -70 L40 35 L40 -70 L85 -70 L85 90 L35 90 L-45 -15 L-45 90 Z" fill="url(#maskableWhite)" />

    <!-- Golden Brand Dot -->
    <circle cx="105" cy="-80" r="16" fill="url(#maskableGold)" />
  </g>

  <!-- Brand Typography Label within safe zone -->
  <text x="256" y="410" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">NIRMAAN</text>
  <text x="256" y="438" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#93C5FD" letter-spacing="3" text-anchor="middle">DEFENCE ACADEMY</text>
</svg>

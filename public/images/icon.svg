<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3" />

  <!-- Center Emblem Group with shadow -->
  <g filter="url(#softShadow)" transform="translate(256, 235)">
    <!-- Golden Arc Swoosh from Logo -->
    <path d="M-150 40 C-130 -90, -40 -110, 30 -50 C-20 -70, -100 -55, -125 40 Z" fill="url(#goldGrad)" opacity="0.95" />
    <path d="M-135 15 C-115 -60, -45 -75, 10 -35" stroke="#FBBF24" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Bold Central N (Nirmaan) -->
    <path d="M-90 90 L-90 -70 L-40 -70 L40 35 L40 -70 L85 -70 L85 90 L35 90 L-45 -15 L-45 90 Z" fill="url(#whiteGrad)" />

    <!-- Golden Brand Dot -->
    <circle cx="105" cy="-80" r="16" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography Label -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">NIRMAAN</text>
  <text x="256" y="450" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#93C5FD" letter-spacing="3" text-anchor="middle">DEFENCE ACADEMY</text>
</svg>

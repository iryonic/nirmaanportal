<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Nirmaan Defence Academy</title>
    <meta name="theme-color" content="#172554">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #172554;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .icon-box {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
           
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-box img {
            width: 52px;
            height: 52px;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 9999px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: #ffffff;
            color: #0f172a;
            font-size: 13px;
            font-weight: 700;
            padding: 14px 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
        }
        .btn-retry:hover {
            background: #f1f5f9;
            transform: translateY(-1px);
        }
        .note {
            font-size: 11px;
            color: #64748b;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-box">
            <img src="/icons/icon-192x192.png" alt="Nirmaan">
        </div>
        
        <div class="status-pill">
            <span class="status-dot"></span>
            <span>No Internet Connection</span>
        </div>

        <h1>You're Currently Offline</h1>
        <p>Your device appears to have lost internet connectivity. Previously downloaded study materials remain accessible in your browser cache.</p>

        <button class="btn-retry" onclick="window.location.reload()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
            </svg>
            Retry Connection
        </button>

        <div class="note">Nirmaan Web App will automatically reconnect when online.</div>
    </div>

    <script>
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
